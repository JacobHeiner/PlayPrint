name: RAWG game metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: write
concurrency:
  group: rawg-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh selected game records
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python3 scripts/rawg_refresh.py
      - name: Commit changed metadata
        run: |
          git config user.name "PlayPrint metadata bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rawg-games/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh selected RAWG game metadata"
          git push
