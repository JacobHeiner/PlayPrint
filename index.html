function pp653Credit(full=false){return '<p class="pp653credit">'+(full?'Game metadata, artwork, release dates and other game information provided in part by ':'Game data provided by ')+'<a href="https://rawg.io/" target="_blank" rel="noopener noreferrer">RAWG</a>.</p>'}

async function pp653Load(){try{const response=await fetch('./rawg-games/index.json');if(!response.ok)return;const rows=await response.json();if(!Array.isArray(rows))return;await Promise.all(rows.slice(0,40).map(async x=>{try{if(!Number.isInteger(x.rawgId)||typeof x.name!=='string')return;const res=await fetch('./rawg-games/'+x.rawgId+'.json');if(!res.ok)return;const m=await res.json();if(m.rawgId!==x.rawgId)return;pp653Meta.set(canonical(x.name),m);if(!gameFor(x.name)){const id=library.find(y=>canonical(y.name)===canonical(x.name))?.gameId||'rawg:'+x.rawgId;catalog.push({id,name:x.name});demoGames.push(x.name)}}catch{}}));const el=document.querySelector('#gameresults');if(el)el.innerHTML=gameResults(document.querySelector('#gamesearch')?.value||'');window.pp653RefreshSearch?.()}catch{}}

const canonical=n=>n.trim().toLowerCase().replace(/[’']/g,'').replace(/^the legend of zelda: /,'');
function gameFor(n){return catalog.find(x=>canonical(x.name)===canonical(n));}
function beginSharedReview(game){
  d=blank();
  d.name=game.name;
  d.gameId=game.id;
  page='review';
  stage='overall';
  g=0;
  settings=false;
  warning=false;
  sync('enter');
  pp639Choose();
}
function gameKey(x){return x.gameId||gameFor(x.name)?.id||'custom:'+canonical(x.name);}
const store={load(){let a=readPref('playprint.reviews.v1',[]);return Array.isArray(a)?a.filter(x=>x&&x.id&&typeof x.name==='string'&&Array.isArray(x.weights)&&Array.isArray(x.details)):[]},save(a){return storageAdapter().write('playprint.reviews.v1',a)}};
library=store.load();
function persist(){if(!store.save(library))alert('Local storage unavailable. Reviews will not survive closing this page.');}
// Ranking projection: one entry per game, derived from individual reviews.
function combined(a=library){let m=new Map();for(let x of a){let k=gameKey(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)}return [...m].map(([id,reviews])=>({id,name:reviews[0].name,reviews,score:reviews.reduce((a,x)=>a+score(x),0)/reviews.length})).sort((a,b)=>b.score-a.score);}
function gameInput(){return `<input type="text" id="name" list="gamecatalog" placeholder="Search games or enter a title" autocomplete="off" value="${esc(d.name)}"><datalist id="gamecatalog">${catalog.map(x=>`<option value="${esc(x.name)}"></option>`).join('')}</datalist>`;}
// Shared preference UI: used by onboarding, settings and review overrides.
function priorityWheel(values){let a=values.every(v=>v===0)?[1,1,1]:values,t=a.reduce((x,y)=>x+y,0),p=balanced(a.map(v=>v/t*100),100),end=0;let stops=a.map((v,i)=>{let start=end;end+=v/t*100;return `${groups[i].color} ${start}% ${end}%`});return `<div class="prioritySummary"><div class="priorityWheel" style="background:conic-gradient(${stops.join(',')})" role="img" aria-label="Category weight distribution"><span>Balance</span></div><div class="priorityLegend">${groups.map((q,i)=>`<div><i style="background:${q.color}"></i><strong>${q.name}</strong><span>${p[i]}%</span></div>`).join('')}</div></div>`}
function prefPreview(){return priorityWheel(prefDraft)}
function prioritySliders(values,kind){return groups.map((q,i)=>`<div class="prioritySlider" style="--priorityColor:${q.color}"><div class="row"><strong>${q.name}</strong><span id="${kind==='pref'?'prefimp':'imp'}${i}">${importance[values[i]]}</span></div><input type="range" min="0" max="4" step="1" value="${values[i]}" data-${kind}="${i}" aria-label="${q.name} priority"></div>`).join('')}
function preferencesPanel(first=false){let editing=first||prefEditing;return `<div class="panel preferencePanel"><h2>Score Preferences</h2><p><strong>Your default priorities for future reviews</strong></p><p class="muted">Give more scoring weight to the aspects of games that matter most to you. Categories you prioritize will contribute more points toward your overall game score. You can always adjust these preferences for individual reviews.</p><div id="prefpreview">${prefPreview()}</div>${editing?`<div class="priorityControls"><p class="muted">What do you prioritize more?</p>${prioritySliders(prefDraft,'pref')}<button class="plain" data-prefbalanced>Balanced</button><button class="primary" data-prefsave>${first?'Save preferences':'Save scoring distribution'}</button></div>`:'<button class="plain priorityEdit" data-prefedit>Edit Preferences</button>'}</div>`}
function pp653OriginalGameResults(q=''){let v=q.trim(),names=[...new Set([...catalog.map(x=>x.name),...library.map(x=>x.name)])];if(!v)return '<h3>Popular Games</h3><p class="muted">Suggested games</p><div class="suggestions">'+[catalog[0],catalog[5],catalog[15],catalog[19]].map(x=>`<button class="suggestionGame" data-pickgame="${esc(x.name)}"><span class="suggestionCover">${ico('Play Activity')}</span><span>${esc(x.name)}</span></button>`).join('')+'</div>';let matches=names.filter(n=>canonical(n).includes(canonical(v)));return matches.length?matches.map(n=>`<button class="plain" data-pickgame="${esc(n)}">${esc(n)}</button>`).join(''):`<p class="muted">No results found</p><button class="plain" data-customgame>＋ Add New Game</button>`}
function pp654Cover(n){const m=pp653Meta.get(canonical(n));return '<span class="pp654cover"><span>'+esc(n)+'</span>'+(typeof m?.image==='string'&&/^https:\/\/media\.rawg\.io\//.test(m.image)?'<img loading="lazy" src="'+esc(m.image)+'" alt="'+esc(n)+'" onerror="this.remove()">':'')+'</span>'}
function gameResults(q=''){let names=q.trim()?[...new Set([...catalog.map(x=>x.name),...library.map(x=>x.name)])].filter(n=>canonical(n).includes(canonical(q))):[catalog[0],catalog[5],catalog[15],catalog[19]].filter(Boolean).map(x=>x.name);return (!q.trim()?'<h3>Popular Games</h3>':'')+'<div class="pp654grid">'+names.map(n=>'<button data-pickgame="'+esc(n)+'" aria-label="'+esc(n)+'">'+pp654Cover(n)+'</button>').join('')+'</div>'+(!names.length?'<p>No results found</p><button class="plain" data-customgame>＋ Add New Game</button>':'')+(names.some(n=>pp653Meta.has(canonical(n)))?pp653Credit():'')}

function pp654Backlog(){let a=readPref('playprint.backlog.v1',[]);return Array.isArray(a)?a.map(x=>typeof x==='string'?x:x.gameId||x.id).filter(Boolean):[]}
function pp656Move(id,delta){let a=pp654Backlog(),i=a.indexOf(id),j=i+delta;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];writePref('playprint.backlog.v1',a);let y=window.scrollY;render();window.scrollTo(0,y)}
function pp654BacklogPage(){let a=pp654Backlog(),sort=readPref('playprint.backlogSort','priority');if(sort==='title')a.sort((x,y)=>v6game(x).name.localeCompare(v6game(y).name));if(sort==='release')a.sort((x,y)=>(pp653Meta.get(canonical(v6game(x).name))?.released||'9999').localeCompare(pp653Meta.get(canonical(v6game(y).name))?.released||'9999'));if(sort==='added'){let dates=readPref('playprint.backlogDates',{});a.sort((x,y)=>(dates[y]||0)-(dates[x]||0))}return '<div class="pp656backlog"><div class="row"><strong>'+a.length+' games</strong><button data-656pick>Add Game</button></div><label>Sort <select id="pp656sort">'+[['priority','My Priority'],['title','Title'],['release','Release Date'],['added','Date Added']].map(([k,n])=>'<option value="'+k+'" '+(sort===k?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+a.map((id,i)=>{let game=v6game(id),st=pp64current().find(x=>x.gameId===id)?.status;return '<article class="pp64post pp656backrow" draggable="'+(sort==='priority')+'" data-656drag="'+esc(id)+'"><div class="row"><button class="pp656coverbutton" data-654open="'+esc(id)+'">'+pp654Cover(game.name)+'</button><div style="flex:1"><strong>'+esc(game.name)+'</strong><small style="display:block">'+esc(st||'Waiting to play')+'</small></div>'+(sort==='priority'?'<button data-656move="-1" data-id="'+esc(id)+'" aria-label="Move up">↑</button><button data-656move="1" data-id="'+esc(id)+'" aria-label="Move down">↓</button>':'')+'</div><div class="pp656backactions">'+[['Playing',st==='Paused'?'Resume':'Start'],['Paused','Pause'],['Dropped','Stop'],['Completed','Complete']].map(([k,n])=>'<button data-656state="'+k+'" data-id="'+esc(id)+'">'+n+'</button>').join('')+'<button data-656remove="'+esc(id)+'" aria-label="Remove from backlog">×</button></div></article>'}).join('')+(a.length?pp653Credit():'<p class="muted">No backlog games yet.</p>')+'</div>'}
function pp656Add(id){let a=pp654Backlog();if(!a.includes(id)){writePref('playprint.backlog.v1',[...a,id]);let dates=readPref('playprint.backlogDates',{});dates[id]=Date.now();writePref('playprint.backlogDates',dates)}}

let pp656Drag=null;document.addEventListener('dragstart',e=>{let b=e.target.closest('[data-656drag]');if(b?.draggable){pp656Drag=b.dataset['656drag'];e.dataTransfer.setData('text/plain',pp656Drag)}});document.addEventListener('dragover',e=>{if(pp656Drag&&e.target.closest('[data-656drag]'))e.preventDefault()});document.addEventListener('drop',e=>{let b=e.target.closest('[data-656drag]');if(!b||!pp656Drag)return;e.preventDefault();let a=pp654Backlog(),i=a.indexOf(pp656Drag),j=a.indexOf(b.dataset['656drag']);if(i>=0&&j>=0){a.splice(i,1);a.splice(j,0,pp656Drag);writePref('playprint.backlog.v1',a);render()}pp656Drag=null});document.addEventListener('dragend',()=>pp656Drag=null);
