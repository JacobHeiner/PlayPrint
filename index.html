function reviewRing(x){let z=displayGroups(x),total=z.reduce((a,v)=>a+v.earned,0),offset=0,shown=displayEarned(x);return `<div class="finalchart"><svg viewBox="0 0 120 120" role="img" aria-label="${x.deep?'Weighted category contributions':'Overall rating distribution'}"><circle cx="60" cy="60" r="43" fill="none" stroke="#8884" stroke-width="24"/>${z.map((v,i)=>{let len=total?v.earned/total*270.18:0,start=offset;offset+=len;return `<circle cx="60" cy="60" r="43" fill="none" stroke="${groups[i].color}" stroke-width="24" stroke-dasharray="${len} ${270.18-len}" stroke-dashoffset="${-start}" transform="rotate(-90 60 60)"/>`}).join('')}</svg><div><small>${x.deep?'Weighted contributions':'Overall rating distribution'}</small>${groups.map((q,i)=>`<div class="row"><span style="color:${q.color}">${q.name}</span><strong>${shown[i]}</strong></div>`).join('')}<small class="ringBonus">${bonus(x)?`Bonus +${bonus(x)}`:'&nbsp;'}</small></div></div>`}

function scoreStyle(n){if(!num(n))return '';let h=Math.max(0,Math.min(100,n))*1.35;let rgb=hslRGB(h,70, n<20?32:48);let l=rgb.map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0);return `background:rgb(${rgb.join(',')});color:${l>.179?'#000':'#fff'}`}

function favoriteView(){return `<div class="favoritegrid">${favorites.map((n,i)=>`<button class="favoritecase ${n?'filled':''}" data-favslot="${i}" aria-label="${n?'Edit '+esc(n):'Add favorite'}">${n?esc(n):'<span class="plus">+</span>'}</button>`).join('')}</div>${favoriteSlot<0?'':`<div class="favoritepicker"><div class="row"><strong>Select a favorite</strong><button class="tag" data-favcancel>Close</button></div><input type="text" id="favsearch" placeholder="Search games" autocomplete="off"><p class="muted">Prototype catalog and reviewed games</p><div id="favresults">${favoriteResults()}</div>${favorites[favoriteSlot]?'<button class="plain" data-favremove>Remove favorite</button>':''}</div>`}`}
function refreshPreferencePanel(){let old=root.querySelector('.preferencePanel');if(old){let t=document.createElement('template');t.innerHTML=preferencesPanel(false);old.replaceWith(t.content)}}
function toggleThemeDisclosure(){let drop=root.querySelector('.themeDrop'),b=root.querySelector('[data-themetoggle]');if(!drop||!b)return;drop.classList.toggle('open',themeExpanded);drop.inert=!themeExpanded;b.setAttribute('aria-expanded',String(themeExpanded));b.querySelector('.themeChevron').textContent=themeExpanded?'⌃':'⌄'}
function refreshAppearance(){applyAccent();root.style.setProperty('--accent',themeAccent());root.querySelectorAll('[data-themechoice]').forEach(b=>{let active=b.dataset.themechoice===theme;b.classList.toggle('chosen',active);b.setAttribute('aria-pressed',String(active))});root.querySelector('.themeSwatch').style.background=themeAccent();root.querySelectorAll('[data-accentchoice]').forEach(b=>{let i=+b.dataset.accentchoice;b.setAttribute('aria-pressed',String(i===themeIndex));let sw=b.querySelector('span');sw.style.background=themePalette[i][theme==='dark'?2:1];sw.textContent=i===themeIndex?'✓':''})}
function appearance(){return `<h3>Appearance</h3><div class="themechoices">${['light','dark'].map(t=>`<button class="plain ${theme===t?'chosen':''}" data-themechoice="${t}" aria-pressed="${theme===t}">${t==='light'?'Light':'Dark'}</button>`).join('')}</div><button class="plain themeDisclosure" data-themetoggle aria-expanded="${themeExpanded}"><strong>Theme Color</strong><span class="themeSwatch" style="background:${themeAccent()}"></span><span class="themeChevron">${themeExpanded?'⌃':'⌄'}</span></button><div class="themeDrop ${themeExpanded?'open':''}" ${themeExpanded?'':'inert'}><div><div class="accentGrid">${themePalette.map((p,i)=>`<button data-accentchoice="${i}" aria-pressed="${i===themeIndex}" class="accentChoice"><span style="background:${p[theme==='dark'?2:1]}">${i===themeIndex?'✓':''}</span>${p[0]}</button>`).join('')}</div></div></div>`}

function profileCounters(){return `<div class="profileCounters" aria-label="Profile statistics">${[[library.length,'Reviews'],[0,'Following'],[0,'Followers']].map(([count,label])=>`<div class="profileCounter"><strong>${count}</strong><span>${label}</span></div>`).join('')}</div>`}

function ppAchievementsData(){
  let revCount = library.length;
  let perfectCount = library.filter(x => {
    let s = typeof x.overall === 'number' ? Math.round(x.overall * 20) : null;
    if (x.deep && typeof calc === 'function') {
      try { s = calc(x).score; } catch(e){}
    }
    return s !== null && s >= 98;
  }).length;
  let bonusCount = library.reduce((acc, x) => acc + (x.awards ? Object.keys(x.awards).length : 0), 0);
  let journalCount = typeof journalEntries !== 'undefined' ? journalEntries.length : 0;
  let listCount = (typeof v6saved !== 'undefined' ? v6saved.length : 0) + (typeof v6collections !== 'undefined' ? v6collections.length : 0);
  let deepCount = library.filter(x => x.deep).length;
  let writtenCount = library.filter(x => x.note && x.note.trim().length > 0).length;
  let favCount = (typeof favorites !== 'undefined' && Array.isArray(favorites)) ? favorites.filter(Boolean).length : 0;

  return [
    {
      id: 'first_review',
      icon: '🎮',
      title: 'First PlayPrint',
      desc: 'Complete and save your very first game review.',
      progress: Math.min(revCount, 1),
      total: 1,
      unlocked: revCount >= 1
    },
    {
      id: 'critic_in_making',
      icon: '✍️',
      title: 'Critic in the Making',
      desc: 'Log and score at least 5 different games.',
      progress: Math.min(revCount, 5),
      total: 5,
      unlocked: revCount >= 5
    },
    {
      id: 'seasoned_reviewer',
      icon: '🏆',
      title: 'Century Club',
      desc: 'Build your collection to 15 game reviews.',
      progress: Math.min(revCount, 15),
      total: 15,
      unlocked: revCount >= 15
    },
    {
      id: 'deep_diver',
      icon: '🔬',
      title: 'Deep Diver',
      desc: 'Complete an in-depth review rating every sub-category.',
      progress: Math.min(deepCount, 1),
      total: 1,
      unlocked: deepCount >= 1
    },
    {
      id: 'wordsmith',
      icon: '📜',
      title: 'Wordsmith',
      desc: 'Write notes or a written review for 3 games.',
      progress: Math.min(writtenCount, 3),
      total: 3,
      unlocked: writtenCount >= 3
    },
